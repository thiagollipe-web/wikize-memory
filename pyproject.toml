[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikize-memory"
version = "0.1.0"
description = "Pipeline assíncrono de extração semântica da Wikipédia em português"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
nlp = [
  "spacy>=3.8,<4",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
summarization = [
  "torch>=2.6,<3",
  "transformers>=4.45,<6",
]
embeddings = [
  "sentence-transformers>=3.4,<6",
  "torch>=2.6,<3",
]
full = [
  "spacy>=3.8,<4",
  "sentence-transformers>=3.4,<6",
  "torch>=2.6,<3",
  "transformers>=4.45,<6",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "twine>=5,<7",
]

[project.scripts]
wikize = "wikize_memory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wikize_memory.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
